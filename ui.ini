; Slyrics — aparência. Salve este arquivo: as mudanças aparecem automaticamente.
[layout]
; left = esquerda | center = centro | right = direita
alignment = center
; top = em cima | center = meio | bottom = embaixo
vertical = center
; Margem lateral e linhas vazias entre os versos
padding = 3
line_spacing = 1
; Largura máxima das letras (em caracteres do terminal)
lyrics_width = 86
border = true
show_progress = true
show_source = true
show_footer = true
cursor = ▎

[colors]
; Cores #RRGGBB. "default" usa a cor do seu terminal.
text = #DEDAD0
muted = #88867F
accent = #C8BA91
border = #69675E
; default mantém o fundo/transparência do seu terminal
background = default
