[layout]
alignment = center
vertical = center
padding = 3
line_spacing = 1
lyrics_width = 86
border = true
show_progress = true
show_source = false
history_dim = true
active_bold = true
font_family = monospace
word_highlight = off
font_size = 14
show_hints = false
show_footer = true
cursor = ▎
icons = true

[playback]
source = native
player = spotify
fps = 180
sync_offset = 0
type_ahead = 0.10
typing_mode = smooth

[pages]
mode = dynamic
min_lines = 2
max_lines = 6
target_seconds = 12
pause_seconds = 2
gap_animation = true

[visualizer]
mode = auto
style = bars
width = 32
width_percent = 85
bottom_margin = 1
height = 3
bar_spacing = 1
bar_width = 1
smoothing_ms = 120
show_label = false
only_gaps = false
input = auto
sensitivity = 100

[theme]
mode = static

[colors]
text = #DEDAD0
muted = #88867F
accent = #C8BA91
border = #69675E
background = default

