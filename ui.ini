; sylrics 0.6.0 — edit this file or use sylrics config set section.key value
; Source: native / auto / spicy. Visualizer: auto / spectrum / activity / off.
; Pages: dynamic / fixed; max_lines is the adjustable hard cap (1–16).
; Colors: #RRGGBB or default. Saves reload live.
[layout]
alignment = center
vertical = center
padding = 3
line_spacing = 1
lyrics_width = 86
border = true
show_progress = true
show_source = false
show_footer = true
cursor = ▎
icons = true

[playback]
source = native
player = spotify
fps = 180
sync_offset = 0
type_ahead = 0.10

[pages]
mode = dynamic
min_lines = 2
max_lines = 6
target_seconds = 12
pause_seconds = 2

[visualizer]
mode = auto
style = bars
width = 32
height = 3
only_gaps = false
input = auto
sensitivity = 100

[colors]
text = #DEDAD0
muted = #88867F
accent = #C8BA91
border = #69675E
background = default

